<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Biblioteca</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-attachment: fixed;
}

.card{
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,.95);
    border-radius: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,.3);
}

.titulo{
    color:white;
    text-align:center;
    margin:30px;
    font-weight:bold;
}

.table{
    font-size:.9rem;
}

.btn{
    border-radius:10px;
}

</style>
</head>
<body>

<div class="container">

<h1 class="titulo">📚🌠 UNIVERSO LITERARIO 🌠📚</h1>

<ul class="nav nav-tabs mb-3" id="tabs">
  <li class="nav-item">
    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#libros">
      Libros
    </button>
  </li>

  <li class="nav-item">
    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#prestamos">
      Préstamos
    </button>
  </li>

  <li class="nav-item">
    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#multas">
      Multas
    </button>
  </li>
</ul>

<div class="tab-content">

<!-- LIBROS -->

<div class="tab-pane fade show active" id="libros">

<div class="card p-4">

<h3>Registrar Libro</h3>

<div class="row">

<div class="col-md-3">
<input type="text" id="titulo" class="form-control" placeholder="Título">
</div>

<div class="col-md-2">
<input type="text" id="autor" class="form-control" placeholder="Autor">
</div>

<div class="col-md-2">
<input type="text" id="editorial" class="form-control" placeholder="Editorial">
</div>

<div class="col-md-2">
<input type="text" id="categoria" class="form-control" placeholder="Categoría">
</div>

<div class="col-md-1">
<input type="number" id="existencias" class="form-control" placeholder="Cant">
</div>

<div class="col-md-2">
<button class="btn btn-success w-100" onclick="agregarLibro()">
Guardar
</button>
</div>

</div>

<hr>

<table class="table table-striped">
<thead>
<tr>
<th>Título</th>
<th>Autor</th>
<th>Editorial</th>
<th>Categoría</th>
<th>Existencias</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaLibros"></tbody>

</table>

</div>
</div>

<!-- PRESTAMOS -->

<div class="tab-pane fade" id="prestamos">

<div class="card p-4">

<h3>Registrar Préstamo</h3>

<div class="row">

<div class="col-md-3">
<input type="text" id="pUsuario" class="form-control" placeholder="Usuario">
</div>

<div class="col-md-3">
<input type="text" id="pPersonal" class="form-control" placeholder="Personal">
</div>

<div class="col-md-3">
<input type="text" id="pLibro" class="form-control" placeholder="Libro">
</div>

<div class="col-md-2">
<input type="date" id="pFecha" class="form-control">
</div>

<div class="col-md-1">
<button class="btn btn-primary" onclick="agregarPrestamo()">
+
</button>
</div>

</div>

<hr>

<table class="table table-striped">

<thead>
<tr>
<th>Usuario</th>
<th>Personal</th>
<th>Libro</th>
<th>Fecha</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaPrestamos"></tbody>

</table>

</div>
</div>

<!-- MULTAS -->

<div class="tab-pane fade" id="multas">

<div class="card p-4">

<h3>Registrar Multa</h3>

<div class="row">

<div class="col-md-3">
<input type="text" id="mUsuario" class="form-control" placeholder="Usuario">
</div>

<div class="col-md-4">
<input type="text" id="mMotivo" class="form-control" placeholder="Motivo">
</div>

<div class="col-md-2">
<input type="number" id="mMonto" class="form-control" placeholder="Monto">
</div>

<div class="col-md-2">
<input type="date" id="mFecha" class="form-control">
</div>

<div class="col-md-1">
<button class="btn btn-danger" onclick="agregarMulta()">
+
</button>
</div>

</div>

<hr>

<table class="table table-striped">

<thead>
<tr>
<th>Usuario</th>
<th>Motivo</th>
<th>Monto</th>
<th>Fecha</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaMultas"></tbody>

</table>

</div>
</div>

</div>

</div>

<script>

let libros = JSON.parse(localStorage.getItem("libros")) || [];
let prestamos = JSON.parse(localStorage.getItem("prestamos")) || [];
let multas = JSON.parse(localStorage.getItem("multas")) || [];

function guardarTodo(){
localStorage.setItem("libros",JSON.stringify(libros));
localStorage.setItem("prestamos",JSON.stringify(prestamos));
localStorage.setItem("multas",JSON.stringify(multas));
}

function renderLibros(){

let html="";

libros.forEach((l,i)=>{

html+=`
<tr>
<td>${l.titulo}</td>
<td>${l.autor}</td>
<td>${l.editorial}</td>
<td>${l.categoria}</td>
<td>${l.existencias}</td>
<td>
<button class="btn btn-warning btn-sm"
onclick="editarLibro(${i})">
Editar
</button>

<button class="btn btn-danger btn-sm"
onclick="eliminarLibro(${i})">
Eliminar
</button>
</td>
</tr>
`;

});

document.getElementById("tablaLibros").innerHTML=html;
guardarTodo();
}

function agregarLibro(){

libros.push({
titulo:titulo.value,
autor:autor.value,
editorial:editorial.value,
categoria:categoria.value,
existencias:existencias.value
});

renderLibros();
}

function editarLibro(i){

let l=libros[i];

l.titulo=prompt("Título",l.titulo);
l.autor=prompt("Autor",l.autor);
l.editorial=prompt("Editorial",l.editorial);
l.categoria=prompt("Categoría",l.categoria);
l.existencias=prompt("Existencias",l.existencias);

renderLibros();
}

function eliminarLibro(i){
libros.splice(i,1);
renderLibros();
}

function renderPrestamos(){

let html="";

prestamos.forEach((p,i)=>{

html+=`
<tr>
<td>${p.usuario}</td>
<td>${p.personal}</td>
<td>${p.libro}</td>
<td>${p.fecha}</td>
<td>
<button class="btn btn-warning btn-sm"
onclick="editarPrestamo(${i})">
Editar
</button>

<button class="btn btn-danger btn-sm"
onclick="eliminarPrestamo(${i})">
Eliminar
</button>
</td>
</tr>
`;

});

tablaPrestamos.innerHTML=html;
guardarTodo();
}

function agregarPrestamo(){

prestamos.push({
usuario:pUsuario.value,
personal:pPersonal.value,
libro:pLibro.value,
fecha:pFecha.value
});

renderPrestamos();
}

function editarPrestamo(i){

prestamos[i].usuario=
prompt("Usuario",prestamos[i].usuario);

prestamos[i].personal=
prompt("Personal",prestamos[i].personal);

prestamos[i].libro=
prompt("Libro",prestamos[i].libro);

prestamos[i].fecha=
prompt("Fecha",prestamos[i].fecha);

renderPrestamos();
}

function eliminarPrestamo(i){
prestamos.splice(i,1);
renderPrestamos();
}

function renderMultas(){

let html="";

multas.forEach((m,i)=>{

html+=`
<tr>
<td>${m.usuario}</td>
<td>${m.motivo}</td>
<td>$${m.monto}</td>
<td>${m.fecha}</td>
<td>
<button class="btn btn-warning btn-sm"
onclick="editarMulta(${i})">
Editar
</button>

<button class="btn btn-danger btn-sm"
onclick="eliminarMulta(${i})">
Eliminar
</button>
</td>
</tr>
`;

});

tablaMultas.innerHTML=html;
guardarTodo();
}

function agregarMulta(){

multas.push({
usuario:mUsuario.value,
motivo:mMotivo.value,
monto:mMonto.value,
fecha:mFecha.value
});

renderMultas();
}

function editarMulta(i){

multas[i].usuario=
prompt("Usuario",multas[i].usuario);

multas[i].motivo=
prompt("Motivo",multas[i].motivo);

multas[i].monto=
prompt("Monto",multas[i].monto);

multas[i].fecha=
prompt("Fecha",multas[i].fecha);

renderMultas();
}

function eliminarMulta(i){
multas.splice(i,1);
renderMultas();
}

renderLibros();
renderPrestamos();
renderMultas();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
